<!DOCTYPE html>
<!-- saved from url=(0061)http://www.tutorialspoint.com/bootstrap/src/grid_ordering.htm -->
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
   <title>Try v1.2 Bootstrap Online</title>
   <link href="./bootstrap.min.css" rel="stylesheet">
   <script src="./jquery.min.js"></script>
   <script src="./bootstrap.min.js"></script>
</head>
<body>

<div class="container">

   <h1>Hello, world!</h1>

   <div class="row">
      <p>Before Ordering</p>
      <div class="col-md-4" style="background-color: #dedef8;
         box-shadow: inset 1px -1px 1px #444, inset -1px 1px 1px #444;">
         I am on left
      </div>
      <div class="col-md-8" style="background-color: #dedef8;
         box-shadow: inset 1px -1px 1px #444, inset -1px 1px 1px #444;">
         I am on right
      </div>
   </div><br>
   <div class="row">
      <p>After Ordering</p>
      <div class="col-md-4 col-md-push-8" style="background-color: #dedef8;
         box-shadow: inset 1px -1px 1px #444, 
         inset -1px 1px 1px #444;">
         I was on left
      </div>
      <div class="col-md-8 col-md-pull-4" style="background-color: #dedef8;
         box-shadow: inset 1px -1px 1px #444, 
         inset -1px 1px 1px #444;">
         I was on right
      </div>
   </div>

</div>



</body></html>
